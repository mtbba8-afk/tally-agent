[package]
name = "tally-office"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "NEAR contract for Tally Front Office invoices, revenue split, and Steward payout policy."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
